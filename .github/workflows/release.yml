name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking (TS7)
        run: npm run typecheck

      - name: Compile TypeScript
        run: npm run build

      - name: Build Windows Installer (NSIS)
        run: npm run dist

      - name: Generate Changelog from Commits
        id: changelog
        shell: pwsh
        run: |
          $tags = @(git tag --sort=-creatordate)
          $prevTag = if ($tags.Count -ge 2) { $tags[1] } else { "" }
          $commits = @()
          if ($prevTag) {
            $commits = @(git log "$prevTag..HEAD" --pretty=format:"- %s" | Where-Object { $_ -notmatch "^- chore\(release\):" })
          }
          if ($commits.Count -eq 0) {
            $commits = @(git log -n 15 --pretty=format:"- %s" | Where-Object { $_ -notmatch "^- chore\(release\):" } | Select-Object -First 5)
          }
          if ($commits.Count -eq 0) {
            $commits = @("- Améliorations et corrections diverses")
          }
          $commits -join "`n" | Set-Content -Path "CHANGELOG_RELEASE.md" -Encoding UTF8
          if (Test-Path "release/latest.yml") {
            $indented = ($commits | ForEach-Object { "  $_" }) -join "`n"
            Add-Content -Path "release/latest.yml" -Value "`nreleaseNotes: |-`n$indented" -Encoding UTF8
          }

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: ${{ github.ref_name }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          body_path: CHANGELOG_RELEASE.md
          generate_release_notes: false
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

