<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historique des journées</title>
    <link rel="icon" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="history.css">
    <link rel="stylesheet" href="updater.css">
</head>
<body>
    <header class="masthead">
        <div class="masthead-inner">
            <div class="title-block">
                <svg class="brand-mark" width="36" height="36" viewBox="0 0 32 32" aria-hidden="true">
                    <rect width="32" height="32" rx="8" class="brand-mark-bg"/>
                    <g fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round">
                        <rect x="10" y="10" width="12" height="12"/>
                        <rect x="10" y="10" width="12" height="12" transform="rotate(45 16 16)"/>
                    </g>
                    <circle cx="16" cy="16" r="2.4" class="brand-mark-dot"/>
                </svg>
                <h1>Historique</h1>
            </div>

            <div class="toolbar">
                <div class="segmented" role="radiogroup" aria-label="Période affichée">
                    <button type="button" role="radio" data-range="7" aria-checked="false">7 jours</button>
                    <button type="button" role="radio" data-range="30" aria-checked="true">30 jours</button>
                    <button type="button" role="radio" data-range="all" aria-checked="false">Tout</button>
                </div>
                <div class="export-group" role="group" aria-label="Exportation des données">
                    <select id="exportFormat" class="export-select" aria-label="Format d'exportation">
                        <option value="xlsx" selected>Excel (.xlsx)</option>
                        <option value="csv">CSV (.csv)</option>
                        <option value="sqlite">Base SQLite (.sqlite)</option>
                    </select>
                    <button type="button" id="exportBtn" class="btn-ghost export-btn" title="Exporter l'historique">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>
                        </svg>
                        <span id="exportBtnLabel">Exporter</span>
                    </button>
                </div>
                <button type="button" id="historySyncBtn" class="btn-ghost" title="Synchroniser l'historique" style="display: none; align-items: center; gap: 6px; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 999px; background: rgba(0, 0, 0, 0.2); color: #fff; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;">
                    <svg id="historySyncIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/>
                    </svg>
                    <span id="historySyncLabel">Synchroniser</span>
                </button>
            </div>
        </div>
    </header>

    <main class="page">
        <p id="summary" class="summary" aria-live="polite"></p>

        <div class="legend" aria-hidden="true">
            <span class="legend-item"><span class="swatch swatch--work"></span>Au travail</span>
            <span class="legend-item"><span class="swatch swatch--pause"></span>Pause</span>
            <span class="legend-item"><span class="swatch swatch--min"></span>Sortie minimale</span>
        </div>

        <div class="axis-row" aria-hidden="true">
            <div class="axis" id="axis"></div>
        </div>

        <div id="days" class="days"></div>

        <p id="status" class="status" role="status" hidden></p>
    </main>

    <script src="../shared/salat-core.js"></script>
    <script src="history-db.js"></script>
    <script src="history.js"></script>
</body>
</html>
